<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2d12 fight viewer</title>
<!-- SIM (book/ruler/sim): the fight viewer. Written by `node book/ruler/sim/view.mjs` from this template: don't edit fights.html, edit
     viewer-template.html and run the script again. One file, no build step, nothing loaded from the network. It knows no rule: it draws the
     engine's log (each event's `ch` list says whose Health, Guard, place and conditions changed). -->
<style>
:root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #23262d; --dim: #6c6f78; --line: #d9d4c7; --grid: #e6e1d4; --pc: #2f5f9e; --npc: #a8402f; --pcsoft: #dbe6f5; --npcsoft: #f3dcd6;
  --t1: #8a8d94; --t2: #c9801c; --t3: #b3261e; --heal: #2e7d4f; --gold: #b8912f; --now: #fff3c4; --guard: #5b8fb0; --wallc: #5d5a52; --roughc: #e3d6ad; }
@media (prefers-color-scheme: dark) { :root { --bg: #17191d; --panel: #1f2227; --ink: #e7e4dc; --dim: #9a9ca3; --line: #353941; --grid: #2a2d34; --pc: #6fa0e0; --npc: #e07a66; --pcsoft: #243449; --npcsoft: #47292a;
  --t1: #8a8d94; --t2: #e0a040; --t3: #ef6a5e; --heal: #5fc08a; --gold: #d8b45a; --now: #4a421f; --guard: #7fb4d6; --wallc: #6f7480; --roughc: #3c3824; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
select, button, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
button { cursor: pointer; min-width: 34px; }
button:hover { border-color: var(--dim); }
button.on { background: var(--pc); color: #fff; border-color: var(--pc); }
label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
.where { font-weight: 600; min-width: 150px; }
main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr); gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
#stats { padding: 8px 12px; color: var(--dim); border-bottom: 1px solid var(--line); }
#stats b { color: var(--ink); }
#now { padding: 8px 12px; min-height: 38px; font-weight: 600; border-bottom: 1px solid var(--line); }
svg { display: block; width: 100%; height: auto; max-height: 70vh; }
.cell { fill: none; stroke: var(--grid); stroke-width: 1; }
.tok { transition: transform .35s ease; }
.tok circle.body { stroke-width: 2.5; }
.tok.pc circle.body { fill: var(--pcsoft); stroke: var(--pc); }
.tok.npc circle.body { fill: var(--npcsoft); stroke: var(--npc); }
.tok.out { opacity: .32; }
.tok.act circle.ring { stroke: var(--gold); stroke-width: 3; fill: none; }
.tok text { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--ink); pointer-events: none; }
.hpbg { fill: var(--line); } .hp { fill: var(--heal); } .hp.low { fill: var(--t2); } .hp.crit { fill: var(--t3); } .gd { fill: var(--guard); }
.fx line { stroke-width: 3; stroke-linecap: round; } .fx .rx { stroke-dasharray: 6 5; }
.fx text { font-size: 15px; font-weight: 800; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.trail { stroke: var(--dim); stroke-width: 2; stroke-dasharray: 3 4; fill: none; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 5px 8px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
th { color: var(--dim); font-weight: 600; font-size: 12px; border-top: 0; }
tr.out td { opacity: .45; } tr.act td { background: var(--now); }
.tag { display: inline-block; min-width: 28px; text-align: center; font-weight: 700; border-radius: 10px; padding: 0 6px; border: 2px solid; }
.tag.pc { border-color: var(--pc); background: var(--pcsoft); } .tag.npc { border-color: var(--npc); background: var(--npcsoft); }
.bar { height: 9px; width: 70px; background: var(--line); border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.bar i { display: block; height: 100%; background: var(--heal); } .bar i.low { background: var(--t2); } .bar i.crit { background: var(--t3); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
#log { max-height: 46vh; overflow: auto; padding: 4px 0; }
#log div { padding: 2px 12px; cursor: pointer; border-left: 3px solid transparent; }
#log div:hover { background: var(--bg); }
#log .r { font-weight: 700; margin-top: 8px; color: var(--dim); cursor: default; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
#log .t { font-weight: 650; margin-top: 4px; }
#log .i { padding-left: 26px; }
#log .cur { background: var(--now); border-left-color: var(--gold); }
#log .past { color: var(--dim); }
.good { color: var(--heal); font-weight: 600; } .wall { fill: var(--wallc); } .rough { fill: var(--roughc); }
.T1 { color: var(--t1); } .T2 { color: var(--t2); } .T3 { color: var(--t3); } .rxn { font-style: italic; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 8px 12px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); }
.legend span { margin-right: 12px; white-space: nowrap; }
.sw { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>2d12 fight viewer</h1>
  <label>Map <select id="mapsel"></select></label>
  <label>Encounter <select id="enc"></select></label>
  <label>Fight <select id="seed"></select></label>
  <span>
    <button id="first" title="To the start (Home)">⏮</button>
    <button id="prev" title="One step back (Left arrow)">◀</button>
    <button id="play" title="Play / pause (Space)">▶</button>
    <button id="next" title="One step (Right arrow)">▶|</button>
    <button id="turn" title="To the next turn (Down arrow)">Next turn</button>
  </span>
  <label>Speed <select id="speed"><option value="1100">Slow</option><option value="600" selected>Normal</option><option value="250">Fast</option><option value="80">Very fast</option></select></label>
  <span class="where" id="where"></span>
</header>
<main>
  <div>
    <div class="card">
      <div id="stats"></div>
      <div id="now"></div>
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">
        <span><i class="sw" style="background:var(--t1)"></i>Tier 1</span><span><i class="sw" style="background:var(--t2)"></i>Tier 2</span><span><i class="sw" style="background:var(--t3)"></i>Tier 3</span>
        <span><i class="sw" style="background:var(--heal)"></i>helps an ally (a heal, Guard, a block)</span><span>dashed line: a Reaction</span><span>dark squares: walls · tinted: Difficult Terrain</span><span>gold ring: whose turn it is</span><span>blue bar: Guard</span><span>1 square = 1 square of the book</span>
      </div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>Creatures</h2>
      <table id="roster"></table>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>What happened</h2>
      <div id="log"></div>
    </div>
  </div>
</main>
<script>
const DATA = /*DATA*/null/*END*/;
const $ = id => document.getElementById(id), SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent = null, text = null) => { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const n1 = x => (Math.round(x * 10) / 10).toString(), esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const CELL = 44;
let fight = null, frames = [], k = 0, timer = null, names = [], short = {}, box = null;

/** A creature's short tag: the first letter of its name and its number ("P1", "A3", "S2", "E1"). */
const tagOf = name => { const m = name.match(/^(.).*?(\d+)$/); return m ? m[1].toUpperCase() + m[2] : name.slice(0, 2); };
/** One event as a line of text (HTML). */
function line(e) {
  const T = t => `<span class="T${t}">Tier ${t}</span>`, d = x => (x ? `, <b>${n1(x)}</b> damage` : "");
  if (e.type === "start") return `Start: ${esc(e.map)}. Initiative: ${e.order.map(n => short[n]).join(", ")}`;
  if (e.type === "turn") return `<b>${short[e.who]}</b> ${esc(e.who)}${e.turn ? `: ${esc(e.turn)}` : ""}${e.escalation ? ` · Escalation ${e.escalation}` : ""}${e.ap != null ? ` · ${e.ap} AP` : ""}`;
  if (e.type === "move") return `${e.how} to (${e.to[0]}, ${e.to[1]})`;
  if (e.type === "action") return `${esc(e.action)}${e.target ? ` on <b>${short[e.target]}</b>` : ""}: ${e.save ? "its Save " : ""}${T(e.tier)}${d(e.damage)}`;
  if (e.type === "attack") return `${e.kind === "special" ? "Special" : "Basic attack"} on <b>${short[e.target]}</b>: ${e.damage ? `<b>${n1(e.damage)}</b> [${e.pool}]` : `<span class="T1">nothing</span>`}`;
  if (e.type === "reaction") return `<span class="rxn${e.protects ? " good" : ""}">Reaction, <b>${short[e.who]}</b>: ${esc(e.reaction)}${e.on ? ` on <b>${short[e.on]}</b>${e.protects ? `, for ${short[e.protects]}` : ""}` : ""}${e.tier ? `: ${T(e.tier)}` : ""}${d(e.damage)}</span>`;
  if (e.type === "help") return `<span class="good">${short[e.who] === short[e.target] ? "" : `<b>${short[e.who]}</b> → `}<b>${short[e.target]}</b>: ${esc(e.what)}${e.amount ? ` <b>+${n1(e.amount)}</b>` : ""}</span>`;
  if (e.type === "collision") return `<b>${short[e.who]}</b> is thrown into ${e.into === "a wall" ? "a wall" : `<b>${short[e.into]}</b>`}: <b>${n1(e.damage)}</b> damage`;
  if (e.type === "down") return `<b class="T3">${short[e.who]} goes Down</b>`;
  if (e.type === "dead") return `<b>${short[e.who]} is out</b>`;
  if (e.type === "end") return `<b>${e.won ? "The party wins" : "The party loses"}</b> in ${e.rounds} rounds`;
  return e.type;
}

function load() {
  stop();
  const here = DATA.fights.filter(f => f.map === $("mapsel").value && f.enc === $("enc").value);
  fight = here.find(f => String(f.seed) === $("seed").value) ?? here[0];
  const start = fight.log[0];
  names = start.creatures.map(c => c.name); short = Object.fromEntries(names.map(n => [n, tagOf(n)]));
  // The state after each event: every creature's { dmg, pos, out, guard, esc, cond }.
  let st = start.creatures.map(c => ({ dmg: c.damage ?? 0, pos: c.pos, out: false, guard: 0, esc: 0, cond: "" }));
  frames = fight.log.map(e => { if (e.ch) { st = st.map(x => ({ ...x })); for (const c of e.ch) st[c.i] = { dmg: c.dmg, pos: c.pos ?? st[c.i].pos, out: c.out, guard: c.guard, esc: c.esc, cond: c.cond }; } return st; });
  const pts = frames.flatMap(s => s.map(x => x.pos)).filter(Boolean), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  box = start.grid ? { x0: 0, x1: start.grid.w - 1, y0: 0, y1: start.grid.h - 1 } : pts.length ? { x0: Math.min(...xs) - 1, x1: Math.max(...xs) + 1, y0: Math.min(...ys) - 1, y1: Math.max(...ys) + 1 } : null;
  const s = DATA.stats[`${fight.map}|${fight.enc}`];
  $("stats").innerHTML = s ? `<b>${esc(fight.enc)}</b> on <b>${esc(fight.log[0].map)}</b> over ${s.runs} fights: the party wins <b>${Math.round(s.won * 100)}%</b> · <b>${n1(s.rounds)}</b> rounds · <b>${Math.round(s.lost * 100)}%</b> of its Health lost · a PC Down in <b>${Math.round(s.down * 100)}%</b>. This fight: seed ${fight.seed}, ${fight.log.at(-1).won ? "won" : "lost"} in ${fight.log.at(-1).rounds} rounds.` : "";
  // The log.
  const L = $("log"); L.innerHTML = "";
  fight.log.forEach((e, i) => { const d = document.createElement("div"); if (e.type === "round") { d.className = "r"; d.textContent = `Round ${e.round}`; } else { d.className = e.type === "turn" || e.type === "start" || e.type === "end" ? "t" : "i"; d.innerHTML = line(e); d.onclick = () => { stop(); go(i); }; } d.dataset.i = i; L.appendChild(d); });
  drawMap(); go(0);
}

const px = p => [(p[0] - box.x0 + 0.5) * CELL, (box.y1 - p[1] + 0.5) * CELL];   // the party at the bottom
let toks = [], fx = null;
function drawMap() {
  const m = $("map"); m.innerHTML = ""; toks = [];
  if (!box) { m.setAttribute("viewBox", "0 0 400 60"); el("text", { x: 200, y: 34, "text-anchor": "middle", fill: "currentColor" }, m, "This fight has no positions (map off)."); return; }
  const W = (box.x1 - box.x0 + 1) * CELL, H = (box.y1 - box.y0 + 1) * CELL;
  m.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (let x = 0; x <= box.x1 - box.x0; x++) for (let y = 0; y <= box.y1 - box.y0; y++) el("rect", { class: "cell", x: x * CELL, y: y * CELL, width: CELL, height: CELL }, m);
  const g0 = fight.log[0].grid; if (g0) { for (const [x, y] of g0.rough) { const [a, b] = px([x, y]); el("rect", { class: "rough", x: a - CELL / 2, y: b - CELL / 2, width: CELL, height: CELL }, m); } for (const [x, y] of g0.walls) { const [a, b] = px([x, y]); el("rect", { class: "wall", x: a - CELL / 2, y: b - CELL / 2, width: CELL, height: CELL }, m); } }
  const trail = el("g", {}, m); m._trail = trail;
  fight.log[0].creatures.forEach((c, i) => {
    const g = el("g", { class: `tok ${c.side}` }, m);
    el("title", {}, g, c.name);
    el("circle", { class: "ring", r: 20, fill: "none" }, g);
    el("circle", { class: "body", r: 15.5 }, g);
    el("text", { y: -1 }, g, tagOf(c.name));
    el("rect", { class: "hpbg", x: -16, y: 17, width: 32, height: 4, rx: 2 }, g);
    const hp = el("rect", { class: "hp", x: -16, y: 17, width: 32, height: 4, rx: 2 }, g), gd = el("rect", { class: "gd", x: -16, y: 13.5, width: 0, height: 2.5, rx: 1 }, g);
    toks.push({ g, hp, gd, health: c.health });
  });
  fx = el("g", { class: "fx" }, m);
}

function go(i) {
  k = Math.max(0, Math.min(fight.log.length - 1, i));
  const e = fight.log[k], st = frames[k], C = fight.log[0].creatures;
  // Whose turn: the last turn event at or before k.
  let actor = null; for (let j = k; j >= 0; j--) if (fight.log[j].type === "turn") { actor = fight.log[j].who; break; }
  if (box) {
    st.forEach((s, i2) => { const t = toks[i2], [x, y] = px(s.pos); t.g.style.transform = `translate(${x}px, ${y}px)`; t.g.classList.toggle("out", s.out); t.g.classList.toggle("act", names[i2] === actor && !s.out);
      const left = Math.max(0, 1 - s.dmg / t.health); t.hp.setAttribute("width", 32 * left); t.hp.setAttribute("class", `hp${left < 0.25 ? " crit" : left < 0.5 ? " low" : ""}`); t.gd.setAttribute("width", Math.min(32, 32 * s.guard / t.health)); });
    fx.innerHTML = ""; $("map")._trail.innerHTML = "";
    const good = e.type === "help" || (e.type === "reaction" && e.protects);   // something that helps an ally: a green line to the one it helps
    const who = e.who != null ? names.indexOf(e.who) : -1, tg = names.indexOf(good && e.protects ? e.protects : e.type === "reaction" ? e.on : e.target);
    if (good && who >= 0 && tg >= 0) { const [a, b] = px(st[who].pos), [c, d] = px(st[tg].pos); if (tg !== who) el("line", { x1: a, y1: b, x2: c, y2: d, stroke: "var(--heal)", class: e.type === "reaction" ? "rx" : "" }, fx); el("circle", { cx: c, cy: d, r: 21, fill: "none", stroke: "var(--heal)", "stroke-width": 3 }, fx); el("text", { x: c, y: d - 26, fill: "var(--heal)" }, fx, e.amount ? `+${n1(e.amount)}` : e.type === "reaction" ? "blocked" : (e.what ?? "")); }
    else
    if (e.type === "move" && e.from) { const [a, b] = px(e.from), [c, d] = px(e.to); el("line", { class: "trail", x1: a, y1: b, x2: c, y2: d }, $("map")._trail); }
    if (["action", "attack", "reaction", "collision"].includes(e.type) && who >= 0 && tg >= 0 && tg !== who) {
      const [a, b] = px(st[who].pos), [c, d] = px(st[tg].pos), tier = e.type === "attack" ? (e.damage ? 2 : 1) : e.type === "reaction" ? (e.tier ?? (e.damage ? 2 : 1)) : e.tier, col = `var(--t${e.save ? 4 - tier : tier})`;
      el("line", { x1: a, y1: b, x2: c, y2: d, stroke: col, class: e.type === "reaction" ? "rx" : "" }, fx);
      if (e.damage) el("text", { x: c, y: d - 24, fill: col }, fx, `-${n1(e.damage)}`);
    }
  }
  $("now").innerHTML = e.type === "round" ? `Round ${e.round}` : (e.who && !["turn", "reaction", "help", "collision", "down", "dead"].includes(e.type) ? `<b>${short[e.who]}</b> ` : "") + line(e);
  $("where").textContent = `Round ${e.round || 1} · step ${k + 1} of ${fight.log.length}`;
  // The roster.
  $("roster").innerHTML = `<tr><th></th><th>Creature</th><th>Health</th><th>Guard</th><th>Esc.</th><th>Conditions</th></tr>` + st.map((s, i2) => { const c = C[i2], left = Math.max(0, c.health - s.dmg), f = left / c.health;
    return `<tr class="${s.out ? "out" : ""}${names[i2] === actor && !s.out ? " act" : ""}"><td><span class="tag ${c.side}">${short[c.name]}</span></td><td>${esc(c.name.replace(/ \d+$/, ""))}</td><td class="num"><span class="bar"><i class="${f < 0.25 ? "crit" : f < 0.5 ? "low" : ""}" style="width:${f * 100}%"></i></span>${n1(left)} / ${c.health}</td><td class="num">${s.guard ? n1(s.guard) : ""}</td><td class="num">${s.esc || ""}</td><td>${s.out ? (c.side === "pc" ? "Down" : "out") : esc(s.cond)}</td></tr>`; }).join("");
  for (const d of $("log").children) { const j = Number(d.dataset.i); d.classList.toggle("cur", j === k); d.classList.toggle("past", j < k); }
  const cur = $("log").querySelector(".cur"); if (cur) { const L = $("log"), top = cur.offsetTop - L.offsetTop; if (top < L.scrollTop + 30 || top > L.scrollTop + L.clientHeight - 60) L.scrollTop = top - L.clientHeight / 3; }
}

function stop() { if (timer) clearInterval(timer); timer = null; $("play").textContent = "▶"; $("play").classList.remove("on"); }
function play() { if (timer) return stop(); if (k >= fight.log.length - 1) go(0); $("play").textContent = "⏸"; $("play").classList.add("on"); timer = setInterval(() => { if (k >= fight.log.length - 1) return stop(); go(k + 1); }, Number($("speed").value)); }
const nextTurn = () => { stop(); let j = k + 1; while (j < fight.log.length - 1 && fight.log[j].type !== "turn") j++; go(j); };

$("mapsel").innerHTML = [...new Set(DATA.fights.map(f => f.map))].map(e => `<option>${esc(e)}</option>`).join("");
const fillEncs = () => { const keep = $("enc").value, list = [...new Set(DATA.fights.filter(f => f.map === $("mapsel").value).map(f => f.enc))]; $("enc").innerHTML = list.map(e => `<option${e === keep ? " selected" : ""}>${esc(e)}</option>`).join(""); };
$("mapsel").onchange = () => { fillEncs(); fillSeeds(); load(); }; fillEncs();
const fillSeeds = () => { $("seed").innerHTML = DATA.fights.filter(f => f.map === $("mapsel").value && f.enc === $("enc").value).map(f => `<option value="${f.seed}">${f.seed}: ${f.log.at(-1).won ? "won" : "lost"}, ${f.log.at(-1).rounds} rounds</option>`).join(""); };
$("enc").onchange = () => { fillSeeds(); load(); }; $("seed").onchange = load;
$("first").onclick = () => { stop(); go(0); }; $("prev").onclick = () => { stop(); go(k - 1); }; $("next").onclick = () => { stop(); go(k + 1); }; $("play").onclick = play; $("turn").onclick = nextTurn;
$("speed").onchange = () => { if (timer) { stop(); play(); } };
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; if (e.key === " ") { e.preventDefault(); play(); } else if (e.key === "ArrowRight") { stop(); go(k + 1); } else if (e.key === "ArrowLeft") { stop(); go(k - 1); } else if (e.key === "ArrowDown") { e.preventDefault(); nextTurn(); } else if (e.key === "Home") { stop(); go(0); } });
fillSeeds(); load();
</script>
</body>
</html>
